<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Aegis | ADE Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [files, setFiles] = useState([]);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            const handleFileChange = (e) => {
                setFiles(Array.from(e.target.files));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (files.length === 0) return;

                setLoading(true);
                setError(null);
                setResult(null);

                const formData = new FormData();
                files.forEach(file => formData.append("files", file));

                try {
                    const response = await fetch("/api/analyze", {
                        method: "POST",
                        body: formData,
                    });
                    const data = await response.json();
                    if (response.ok) {
                        setResult(data);
                    } else {
                        setError(data.error || "Analysis failed");
                    }
                } catch (err) {
                    setError("Failed to connect to the backend server.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    {/* Header */}
                    <header className="max-w-6xl mx-auto mb-8 flex justify-between items-center">
                        <div>
                            <h1 className="text-3xl font-bold text-slate-900 tracking-tight flex items-center">
                                <span className="bg-blue-600 text-white p-2 rounded-lg mr-3">🛡️</span>
                                Project Aegis
                            </h1>
                            <p className="text-slate-500 mt-1">Agentic Document Extraction for Government Tenders</p>
                        </div>
                        <div className="hidden md:block">
                            <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium border border-green-200">
                                Prototype
                            </span>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Left Column: Upload */}
                        <div className="lg:col-span-1 space-y-6">
                            <section className="glass p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-semibold text-slate-800 mb-4 flex items-center">
                                    <i data-lucide="upload" className="w-5 h-5 mr-2 text-blue-500"></i>
                                    Upload Documents
                                </h2>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-blue-400 transition-colors bg-slate-50">
                                        <input 
                                            type="file" 
                                            multiple 
                                            onChange={handleFileChange}
                                            className="hidden" 
                                            id="file-upload" 
                                        />
                                        <label htmlFor="file-upload" className="cursor-pointer">
                                            <div className="text-slate-400 mb-2">📁</div>
                                            <span className="text-blue-600 font-medium hover:underline">Click to upload</span>
                                            <p className="text-xs text-slate-500 mt-1">Select PDF or Excel files</p>
                                        </label>
                                    </div>
                                    
                                    {files.length > 0 && (
                                        <div className="text-sm text-slate-600 bg-white p-3 rounded-lg border border-slate-100">
                                            <p className="font-medium mb-1">Selected Files:</p>
                                            <ul className="list-disc list-inside space-y-1 text-xs">
                                                {files.map((f, i) => <li key={i}>{f.name}</li>)}
                                            </ul>
                                        </div>
                                    )}

                                    <button 
                                        type="submit"
                                        disabled={loading || files.length === 0}
                                        className={`w-full py-3 rounded-xl font-semibold text-white shadow-lg shadow-blue-200 transition-all ${loading ? 'bg-slate-400' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        {loading ? "Analyzing via NIM..." : "Start AI Evaluation"}
                                    </button>
                                </form>
                            </section>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-sm flex items-start">
                                    <span className="mr-2">⚠️</span>
                                    {error}
                                </div>
                            )}
                        </div>

                        {/* Right Column: Results */}
                        <div className="lg:col-span-2 space-y-8">
                            {result ? (
                                <>
                                    {/* Metrics Grid */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <MetricCard label="Accuracy" value={result.metrics.accuracy} color="text-blue-600" />
                                        <MetricCard label="Precision" value={result.metrics.precision} color="text-indigo-600" />
                                        <MetricCard label="Recall" value={result.metrics.recall} color="text-violet-600" />
                                        <MetricCard label="Status" value={result.status} color="text-green-600" isStatus />
                                    </div>

                                    {/* Detailed Evaluations */}
                                    <section className="glass rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="p-6 border-b border-slate-100 bg-white">
                                            <h2 className="text-lg font-semibold text-slate-800">Compliance Audit Ledger</h2>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left">
                                                <thead className="bg-slate-50 text-slate-500 text-xs font-semibold uppercase tracking-wider">
                                                    <tr>
                                                        <th className="px-6 py-3">Requirement</th>
                                                        <th className="px-6 py-3">Source File</th>
                                                        <th className="px-6 py-3">Extracted Value</th>
                                                        <th className="px-6 py-3">Confidence</th>
                                                        <th className="px-6 py-3">Status</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {result.evaluations.map((ev, i) => (
                                                        <tr key={i} className="hover:bg-slate-50 transition-colors">
                                                            <td className="px-6 py-4">
                                                                <div className="text-xs font-semibold text-slate-900">{ev.parameter_id.slice(0, 8)}</div>
                                                                <div className="text-[10px] text-slate-500 max-w-xs truncate" title={ev.rule_description}>{ev.rule_description}</div>
                                                            </td>
                                                            <td className="px-6 py-4 text-[10px] font-mono text-slate-500">{ev.source_file}</td>
                                                            <td className="px-6 py-4">
                                                                <div className="text-sm text-slate-700 font-medium">{ev.extracted_value}</div>
                                                                <div className="text-[10px] text-slate-400 italic mt-1">{ev.rationale}</div>
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <div className="flex items-center">
                                                                    <div className="w-12 bg-slate-200 rounded-full h-1.5 mr-2">
                                                                        <div className="bg-blue-500 h-1.5 rounded-full" style={{width: `${Math.min(100, ev.confidence > 1 ? ev.confidence : ev.confidence * 100)}%`}}></div>
                                                                    </div>
                                                                    <span className="text-xs font-medium">{ev.confidence > 1 ? ev.confidence : (ev.confidence * 100).toFixed(0)}%</span>
                                                                </div>
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <span className={`px-2 py-1 rounded-full text-[10px] font-bold uppercase ${
                                                                    ev.status === "COMPLIANT" ? "bg-green-100 text-green-700" :
                                                                    ev.status === "NON_COMPLIANT" ? "bg-red-100 text-red-700" :
                                                                    "bg-amber-100 text-amber-700"
                                                                }`}>
                                                                    {ev.status.replace(/_/g, ' ')}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </section>

                                    {/* Visual Grounding Viewer */}
                                    {result.grounded_pdf_url && (
                                        <section className="glass p-6 rounded-2xl shadow-sm border border-slate-200">
                                            <h2 className="text-lg font-semibold text-slate-800 mb-4 flex items-center">
                                                <span className="bg-red-100 text-red-600 p-1.5 rounded-lg mr-2 text-sm">🎯</span>
                                                Visual Grounding Evidence
                                            </h2>
                                            <div className="aspect-[16/9] w-full bg-slate-800 rounded-xl overflow-hidden shadow-inner border border-slate-700">
                                                <iframe 
                                                    src={result.grounded_pdf_url} 
                                                    className="w-full h-full"
                                                    title="Visual Evidence"
                                                ></iframe>
                                            </div>
                                            <p className="text-xs text-slate-500 mt-4 italic text-center">
                                                The red translucent boxes indicate the visual regions identified by the VLM for each requirement.
                                            </p>
                                        </section>
                                    )}
                                </>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-center p-12 border-2 border-dashed border-slate-200 rounded-3xl bg-white">
                                    <div className="text-6xl mb-4">✨</div>
                                    <h3 className="text-xl font-semibold text-slate-800">Ready for Analysis</h3>
                                    <p className="text-slate-500 max-w-sm mx-auto mt-2">
                                        Upload tender documents to see the SOTA ADE pipeline in action. Visual grounding and compliance metrics will appear here.
                                    </p>
                                </div>
                            )}
                        </div>
                    </main>
                    <footer className="max-w-6xl mx-auto mt-12 py-6 border-t border-slate-200 text-center text-slate-400 text-sm">
                        Built for AI for Bharat Hackathon | Agentic Document Extraction Platform
                    </footer>
                </div>
            );
        };

        const MetricCard = ({ label, value, color, isStatus }) => (
            <div className="glass p-4 rounded-xl shadow-sm border border-slate-200">
                <p className="text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">{label}</p>
                <p className={`text-xl font-bold ${color}`}>
                    {typeof value === 'number' ? value.toFixed(4) : value}
                </p>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Initialize Lucide icons
        window.addEventListener('load', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
